name: Pruebas y Cobertura (GitHub Pages)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f src/requirements.txt ]; then pip install -r src/requirements.txt; fi
          pip install pytest pytest-cov mutmut semgrep

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Create GH Pages site structure
        run: |
          mkdir -p public/coverage
          mkdir -p public/mutation
          mkdir -p public/semgrep
          mkdir -p public/snyk
          mkdir -p public/docs
          cp docs/FD01-Informe-Factibilidad.pdf docs/FD02-Informe-Vision.pdf \
             docs/FD03-Informe-SRS.pdf docs/FD04-Informe-SAD.pdf \
             docs/FD05-Informe-ProyectoFinal.pdf docs/FD06-Informe-PropuestaProyecto.pdf \
             docs/Diccionario-de-datos.pdf public/docs/ 2>/dev/null || true
          # Copy the index file if it exists in the repo
          if [ -f gh-pages-site/index.html ]; then
            cp gh-pages-site/index.html public/
          else
            echo "<h1>Reportes</h1><ul><li><a href='coverage/index.html'>Coverage</a></li></ul>" > public/index.html
          fi
          if [ -f gh-pages-site/reportes.html ]; then
            cp gh-pages-site/reportes.html public/
          fi

      - name: Run unit tests and collect coverage
        run: |
          pytest --cov=src --cov-report=html:public/coverage tests/ || true

      - name: Run Mutation Testing (Mutmut)
        run: |
          mutmut run || true
          mutmut html --directory public/mutation || true

      - name: Run Semgrep (SAST) and generate HTML report
        run: |
          mkdir -p public/semgrep
          semgrep scan --config auto --json --output public/semgrep/results.json src/ || true
          python scripts/generate_semgrep_report.py

      - name: Run Snyk and generate HTML report
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          mkdir -p public/snyk
          if [ -z "$SNYK_TOKEN" ]; then
            echo "<h1>Snyk</h1><p>El secreto SNYK_TOKEN no esta configurado en este repositorio. Configuralo en Settings &gt; Secrets and variables &gt; Actions.</p>" > public/snyk/index.html
          else
            npm install -g snyk snyk-to-html
            if [ -f src/requirements.txt ]; then
              snyk test --file=src/requirements.txt --package-manager=pip --json > public/snyk/results.json || true
            else
              echo '{}' > public/snyk/results.json
            fi
            snyk-to-html -i public/snyk/results.json -o public/snyk/index.html || \
              echo "<h1>Snyk</h1><p>No se pudo generar el reporte detallado a partir del escaneo.</p>" > public/snyk/index.html
          fi
        continue-on-error: true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
