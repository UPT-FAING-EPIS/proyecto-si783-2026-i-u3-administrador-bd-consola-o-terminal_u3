name: Seguridad y Calidad de Código

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  snyk-scan:
    name: Escaneo de Vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configurar Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar Snyk para buscar vulnerabilidades
        # snyk/actions no publica tags versionados estables; se fija al commit
        # más reciente de master en vez de depender de la rama mutable directamente.
        uses: snyk/actions/python@8e119fbb6c251787721d34ba683ed48eba792766
        continue-on-error: true # Para que no bloquee tu avance si encuentra algo, pero que el reporte aparezca
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
